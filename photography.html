<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos — Solomon Guttmann</title>
    <link rel="stylesheet" href="style.css">
    <script>
      // Arriving through the needle's eye: fade the page in from the straw-coloured screen.
      try {
        if (sessionStorage.getItem('via-needle')) {
          sessionStorage.removeItem('via-needle');
          document.documentElement.classList.add('via-needle');
        }
      } catch (e) { /* storage blocked: no fade */ }
    </script>
  </head>

  <body>

    <header class="masthead">
      <a href="index.html" class="wordmark">Solomon Guttmann</a>
      <nav class="nav" aria-label="Main">
        <a href="photography.html" aria-current="page">Fotos</a>
        <a href="film.html">Film</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main class="page">
      <div class="page-head">
        <h1 class="display">Fotos</h1>
        <a class="text-link" href="map.html">Browse by country</a>
      </div>

      <ul class="collections" id="collections"></ul>
    </main>

    <script src="data.js"></script>
    <script src="site.js"></script>
    <script>
      const list = document.getElementById('collections');

      collections
        .filter(c => c.parent === null)
        .sort((a, b) => (a.order || 999) - (b.order || 999))
        .forEach(c => {
          const pending = c.type === 'coming-soon';
          const thumbs = pending
            ? [h('div', { class: 'empty-frame' })]
            : previewPhotos(c.id, 4).map(p => thumbImg(p));

          const body = [
            h('div', { class: 'collection-text' },
              h('h2', { class: 'collection-title' }, c.title),
              c.subtitle && c.subtitle !== '...' ? h('p', { class: 'lede' }, c.subtitle) : null,
              h('p', { class: 'collection-desc' }, c.description),
              pending ? null : h('p', { class: 'meta' }, countLabel(c) + ', ' + photosUnder(c.id).length + ' photographs')
            ),
            h('div', { class: 'thumbs', 'aria-hidden': 'true' }, thumbs)
          ];

          list.append(h('li', { class: 'collection-row' + (pending ? ' is-pending' : '') },
            pending
              ? h('div', { class: 'collection-link' }, body)
              : h('a', { class: 'collection-link', href: hrefFor(c) }, body)
          ));
        });
    </script>

  </body>

</html>
