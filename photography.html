<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos — Solomon Guttmann</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <header class="masthead">
      <a href="index.html" class="wordmark">Solomon Guttmann</a>
      <nav class="nav" aria-label="Main">
        <a href="photography.html" aria-current="page">Fotos</a>
        <a href="film.html">Film</a>
        <a href="about.html">About</a>
        <a href="put-it-on-paper/">Put It On Paper</a>
      </nav>
    </header>

    <main class="page">
      <div class="page-head">
        <h1 class="display">Fotos</h1>
        <a class="text-link" href="map.html">Browse by country</a>
      </div>

      <ul class="collections" id="collections"></ul>
    </main>

    <footer class="site-foot">
      <div class="foot-leak" aria-hidden="true"></div>
      <div class="foot-body">
        <a class="foot-name" href="index.html">Solomon Guttmann</a>
        <nav class="foot-nav" aria-label="Footer">
          <a href="photography.html">Fotos</a>
          <a href="film.html">Film</a>
          <a href="about.html">About</a>
          <a href="put-it-on-paper/">Put It On Paper</a>
        </nav>
      </div>
    </footer>

    <script src="data.js"></script>
    <script src="site.js"></script>
    <script>
      const list = document.getElementById('collections');

      collections
        .filter(c => c.parent === null)
        .sort((a, b) => (a.order || 999) - (b.order || 999))
        .forEach(c => {
          // Coming soon, or a new collection with no photos yet: shown faded, not linked.
          const pending = c.type === 'coming-soon' || photosUnder(c.id).length === 0;
          const thumbs = pending
            ? [h('div', { class: 'empty-frame' })]
            : previewPhotos(c.id, 4).map(p => thumbImg(p, {}, true));

          const body = [
            h('div', { class: 'collection-text' },
              h('h2', { class: 'collection-title' }, c.title),
              c.subtitle && c.subtitle !== '...' ? h('p', { class: 'lede' }, c.subtitle) : null
            ),
            h('div', { class: 'thumbs', 'aria-hidden': 'true' }, thumbs)
          ];

          list.append(h('li', { class: 'collection-row' + (pending ? ' is-pending' : '') },
            pending
              ? h('div', { class: 'collection-link' }, body)
              : h('a', { class: 'collection-link', href: hrefFor(c) }, body)
          ));
        });
    </script>

  </body>

</html>
