<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film — Solomon Guttmann</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <header class="masthead">
      <a href="index.html" class="wordmark">Solomon Guttmann</a>
      <nav class="nav" aria-label="Main">
        <a href="photography.html">Fotos</a>
        <a href="film.html" aria-current="page">Film</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main class="page">
      <div class="page-head">
        <h1 class="display">Film</h1>
      </div>

      <div class="film">
        <div class="player">
          <iframe
            id="film-iframe"
            title="El Camino"
            src="https://player.vimeo.com/video/1180888648?badge=0&autopause=0&player_id=0&app_id=58479"
            allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>

        <ul class="film-list" id="film-list" aria-label="Films"></ul>
      </div>
    </main>

    <script src="site.js"></script>
    <script>
      const films = [
        { id: "1180888648", title: "El Camino" },
        { id: "1180890762", title: "No Campo" },
        { id: "1180891550", title: "Rio en Medio" },
        { id: "1180892535", title: "Viva na Casa" },
      ];

      const iframe = document.getElementById('film-iframe');
      const list = document.getElementById('film-list');
      let current = 0;

      const buttons = films.map((film, i) => {
        const b = h('button', { type: 'button' }, film.title);
        b.addEventListener('click', () => play(i));
        list.append(h('li', {}, b));
        return b;
      });

      function play(i) {
        current = (i + films.length) % films.length;
        const film = films[current];
        iframe.src = `https://player.vimeo.com/video/${film.id}?badge=0&autopause=0&player_id=0&app_id=58479`;
        iframe.title = film.title;
        buttons.forEach((b, k) => b.setAttribute('aria-current', k === current ? 'true' : 'false'));
      }

      buttons[0].setAttribute('aria-current', 'true');
    </script>

  </body>

</html>
