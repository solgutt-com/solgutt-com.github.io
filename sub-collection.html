<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos — Solomon Guttmann</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <header class="masthead">
      <a href="index.html" class="wordmark">Solomon Guttmann</a>
      <nav class="nav" aria-label="Main">
        <a href="photography.html" aria-current="page">Fotos</a>
        <a href="film.html">Film</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main class="page">
      <div class="collection-intro">
        <nav class="trail" id="trail" aria-label="Breadcrumb"></nav>
        <h1 class="display" id="title"></h1>
        <p class="lede" id="subtitle"></p>
      </div>

      <ul class="cards" id="cards"></ul>
    </main>

    <script src="data.js"></script>
    <script src="site.js"></script>
    <script>
      const id = new URLSearchParams(location.search).get('id');
      const collection = byId(id);

      if (!collection || collection.type !== 'parent') {
        location.replace('photography.html');
      } else {
        document.title = collection.title + ' — Solomon Guttmann';
        renderTrail(document.getElementById('trail'), id);
        document.getElementById('title').textContent = collection.title;
        document.getElementById('subtitle').textContent = collection.subtitle;

        const cards = document.getElementById('cards');
        childrenOf(id).forEach(child => {
          const cover = previewPhotos(child.id, 1)[0];
          const pending = child.type === 'coming-soon' || photosUnder(child.id).length === 0;
          const body = [
            cover
              ? thumbImg(cover, { class: 'card-img' })
              : h('div', { class: 'card-img' }),
            h('h2', { class: 'card-title' }, child.title),
            child.subtitle ? h('p', { class: 'card-subtitle' }, child.subtitle) : null
          ];
          cards.append(h('li', {},
            pending
              ? h('div', { class: 'card-link is-pending' }, body)
              : h('a', { class: 'card-link', href: hrefFor(child) }, body)
          ));
        });
      }
    </script>

  </body>

</html>
