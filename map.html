<!DOCTYPE html>

  <head>
    <meta charset="UTF-8">

    <div class="fotos-layout">

      <div class="region-menu">
        <div class="region-menu-icon">&#9776;</div>
        <div class="region-menu-list">
          <div class="region-menu-section">Europe</div>

        </div>

      <div class="map-outer">
        <p class="map-instructions">Do you need instructions?</p>
        <p class="map-quote" id="map-quote"></p>
        <p class="map-quote-author" id="map-quote-author"></p>
        <div class="map-box">
          <div class="map-container">
            <svg id="map-svg" viewBox="0 0 960 500" width="100%">
              <defs>
                <pattern id="px" width="4" height="4" patternUnits="userSpaceOnUse">
                  <rect width="3" height="3" fill="#5a3e2b"/>
                  <rect x="3" y="0" width="1" height="4" fill="#4a3222"/>
                  <rect x="0" y="3" width="4" height="1" fill="#4a3222"/>
                </pattern>
              </defs>
              <g id="map-world"></g>
              <g id="map-regions"></g>
              <g id="map-specials"></g>
            </svg>
            <div id="map-tooltip"></div>
          </div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
    <script src="quotes.js"></script>
    <script src="data.js"></script>
    <script>

      const COUNTRY_IDS = {
        8:   'AL', 40:  'AT', 70:  'BA', 191: 'HR',
        233: 'EE', 246: 'FI', 250: 'FR', 276: 'DE',
        380: 'IT', 440: 'LT', 499: 'ME', 528: 'NL',
        616: 'PL', 620: 'PT', 705: 'SI', 710: 'ZA',
        716: 'ZW', 724: 'ES', 752: 'SE', 756: 'CH',
        428: 'LV'
      };


      const proj = d3.geoNaturalEarth1().scale(153).translate([480, 250]);
      const path = d3.geoPath().projection(proj);
      const tooltip = document.getElementById('map-tooltip');

      function showTooltip(name) {
        tooltip.textContent = name;
        tooltip.style.opacity = 1;
      }

      function hideTooltip() {
        tooltip.style.opacity = 0;
      }

      function navigate(code) {
        window.location.href = 'countries/gallery.html?code=' + code;
      }

const q = quotes[Math.floor(Math.random() * quotes.length)];
document.getElementById('map-quote').textContent = '\u201C' + q.text + '\u201D';
document.getElementById('map-quote-author').textContent = '\u2014 ' + q.author;

      d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then(function(world) {
        const features = topojson.feature(world, world.objects.countries).features;

        // Ghost world outline
        d3.select('#map-world')
          .selectAll('path')
          .data(features)
          .join('path')
          .attr('d', path)
          .attr('fill', 'none')
          .attr('stroke', '#2a2a28')
          .attr('stroke-width', 0.4);

        // Active countries
        d3.select('#map-regions')
          .selectAll('path')
          .data(features.filter(function(d) { return COUNTRY_IDS[+d.id]; }))
          .join('path')
          .attr('class', 'map-region')
          .attr('d', path)
          .attr('fill', 'url(#px)')
          .attr('stroke', '#6a6a62')
          .attr('stroke-width', 0.6)
          .on('mouseenter', function(e, d) { showTooltip(siteData[COUNTRY_IDS[+d.id]].name); })
          .on('mouseleave', hideTooltip)
          .on('click', function(e, d) { navigate(COUNTRY_IDS[+d.id]); });

        const sg = d3.select('#map-specials');




        // Monstera leaf — The Jungle (Amazon region)
        const junglePos = proj([-60, -5]);
        const jg = sg.append('g')
          .attr('class', 'map-region')
          .attr('transform', 'translate(' + junglePos[0] + ',' + junglePos[1] + ')')
          .on('mouseenter', function() { showTooltip('The Jungle'); })
          .on('mouseleave', hideTooltip)
          .on('click', function() { navigate('TheJungle'); });

        // Simple monstera leaf shape — two lobed leaf with midrib
        jg.append('path')
          .attr('d', [
            'M0,0',
            'C-2,-6 -8,-10 -6,-16',
            'C-4,-20 0,-22 0,-22',
            'C0,-22 4,-20 6,-16',
            'C8,-10 2,-6 0,0Z',
            'M-6,-16',
            'C-10,-14 -12,-10 -10,-6',
            'C-8,-2 -4,0 0,0',
            'M6,-16',
            'C10,-14 12,-10 10,-6',
            'C8,-2 4,0 0,0',
            'M0,-22 L0,0'
          ].join(' '))
          .attr('fill', 'url(#px)')
          .attr('stroke', '#6a6a62')
          .attr('stroke-width', 0.6)
          .attr('fill-rule', 'evenodd');

      });

    </script>

  </body>

</html>
