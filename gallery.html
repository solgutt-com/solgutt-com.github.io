<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solomon Guttmann</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body class="darkroom">

    <header class="masthead">
      <a href="index.html" class="wordmark">Solomon Guttmann</a>
      <nav class="nav" aria-label="Main">
        <a href="photography.html" aria-current="page">Fotos</a>
        <a href="film.html">Film</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <div class="viewer-head">
      <nav class="trail" id="trail" aria-label="Breadcrumb"></nav>
      <p class="muted" id="description"></p>
    </div>

    <main class="viewer" id="viewer">
      <button class="viewer-half prev" tabindex="-1" aria-hidden="true" onclick="step(-1)"></button>
      <img id="photo" alt="">
      <button class="viewer-half next" tabindex="-1" aria-hidden="true" onclick="step(1)"></button>
    </main>

    <div class="viewer-bar">
      <p class="viewer-caption" id="caption" aria-live="polite"></p>
      <p class="viewer-count" id="count"></p>
      <div class="viewer-steps">
        <button type="button" onclick="step(-1)">Previous</button>
        <button type="button" onclick="step(1)">Next</button>
      </div>
    </div>

    <ol class="strip" id="strip" aria-label="All photographs in this gallery"></ol>

    <script src="data.js"></script>
    <script src="site.js"></script>
    <script>
      const code = new URLSearchParams(location.search).get('code');
      const gallery = byId(code);
      if (!gallery || !gallery.photos) location.replace('photography.html');

      const photos = gallery.photos;
      const img = document.getElementById('photo');
      const strip = document.getElementById('strip');
      let current = 0;

      document.title = gallery.title + ' — Solomon Guttmann';
      renderTrail(document.getElementById('trail'), code);
      document.getElementById('description').textContent = gallery.description || '';

      const thumbs = photos.map((p, i) => {
        const b = h('button', { type: 'button', 'aria-label': (i + 1) + ': ' + (p.caption || 'Photograph') },
          thumbImg(p));
        b.addEventListener('click', () => show(i));
        strip.append(h('li', {}, b));
        return b;
      });

      function show(i) {
        current = (i + photos.length) % photos.length;
        const p = photos[current];
        img.classList.add('is-loading');
        const next = new Image();
        next.onload = next.onerror = () => {
          if (photos[current] !== p) return;
          img.src = next.src;
          img.alt = p.caption || '';
          img.classList.remove('is-loading');
        };
        next.src = photoSrc(p);
        document.getElementById('caption').textContent = p.caption || '';
        document.getElementById('count').textContent = (current + 1) + ' of ' + photos.length;
        thumbs.forEach((t, k) => t.setAttribute('aria-current', k === current ? 'true' : 'false'));
        thumbs[current].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
        history.replaceState(null, '', '#' + (current + 1));
        // Warm the cache for the next photograph.
        if (photos.length > 1) new Image().src = photoSrc(photos[(current + 1) % photos.length]);
      }

      function step(d) { if (photos.length) show(current + d); }

      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') step(1);
        if (e.key === 'ArrowLeft') step(-1);
      });

      if (photos.length) {
        show((parseInt(location.hash.slice(1), 10) || 1) - 1);
      } else {
        document.getElementById('viewer').replaceChildren(
          h('p', { class: 'viewer-empty' }, 'No photographs here yet.'));
        document.querySelector('.viewer-bar').hidden = true;
      }
    </script>

  </body>

</html>
