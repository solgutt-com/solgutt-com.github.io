<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solomon Guttmann</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load the photographs page ahead of time so the zoom through the eye lands without a pause. -->
    <link rel="prefetch" href="photography.html">
    <link rel="prefetch" href="data.js">
    <link rel="prefetch" href="site.js">
    <script type="speculationrules">
      { "prerender": [{ "source": "list", "urls": ["photography.html"] }] }
    </script>
  </head>

  <body class="home">

    <header class="masthead">
      <nav class="nav" aria-label="Main">
        <a href="photography.html">Fotos</a>
        <a href="film.html">Film</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main class="home-main">
      <div class="home-intro">
        <h1 class="home-name">Solomon<br>Guttmann</h1>
        <div class="home-copy">
          <p class="home-tagline">Looking for a needle in a haystack.</p>
          <p>Professional Photographer. Journalist. Researcher.</p>
          <p><a class="text-link" href="about.html">Contact for inquiries, collaborations, and commissions.</a></p>
        </div>
      </div>

      <figure class="haystack" id="haystack">
        <svg id="haystack-svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMax meet" role="group" aria-label="A needle standing upright in a haystack"></svg>
        <figcaption>Find the needle to see my work</figcaption>
      </figure>
    </main>

    <script>
      const NS = 'http://www.w3.org/2000/svg';
      const W = 1200, BASE = 412;
      const svg = document.getElementById('haystack-svg');
      const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const rand = (a, b) => a + Math.random() * (b - a);
      const pick = list => list[Math.floor(Math.random() * list.length)];

      function el(tag, attrs) {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        return e;
      }

      // Height of the mound at x: a low, soft dome with a few lumps.
      function mound(x) {
        const t = (x - W / 2) / 560;
        if (Math.abs(t) >= 1) return 0;
        return 250 * Math.pow(1 - t * t, 0.65) + 12 * Math.sin(x / 47) + 8 * Math.sin(x / 19);
      }

      function line(x, y, len, angle, attrs) {
        const dx = Math.cos(angle) * len / 2, dy = Math.sin(angle) * len / 2;
        return el('line', {
          x1: (x - dx).toFixed(1), y1: (y - dy).toFixed(1),
          x2: (x + dx).toFixed(1), y2: (y + dy).toFixed(1),
          ...attrs
        });
      }

      // ─── Shared paints: hay shading, the blurred far layer, the needle's olive-silver ───

      const defs = el('defs', {});
      defs.innerHTML = `
        <linearGradient id="hay-shade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#C3A55C"/><stop offset="1" stop-color="#94763A"/>
        </linearGradient>
        <filter id="far-blur" x="-5%" y="-5%" width="110%" height="110%">
          <feGaussianBlur stdDeviation="1.2"/>
        </filter>
        <linearGradient id="olive-silver" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#3B4030"/>
          <stop offset="0.3" stop-color="#8F947D"/>
          <stop offset="0.5" stop-color="#E4E6DA"/>
          <stop offset="0.7" stop-color="#9DA28B"/>
          <stop offset="1" stop-color="#363B2C"/>
        </linearGradient>
        <radialGradient id="halo">
          <stop offset="0" stop-color="#F2E8C4" stop-opacity="0.95"/>
          <stop offset="1" stop-color="#F2E8C4" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="entry-shadow">
          <stop offset="0" stop-color="#23281C" stop-opacity="0.32"/>
          <stop offset="1" stop-color="#23281C" stop-opacity="0"/>
        </radialGradient>`;
      svg.append(defs);

      // ─── The needle's place ───

      const NX = 600;                       // where it stands
      const TILT = -7;                      // degrees off upright
      const LEN = 200;                      // eye end to point
      const HALF_W = 3.6;                   // half the shaft's width at the head
      const SINK = 46;                      // how much of it is buried
      const EYE_Y = 17;                     // eye centre, measured down from the head
      const EYE_RX = 1.5, EYE_RY = 7;       // eye opening: narrow and long, along the shaft
      const ENTRY_Y = BASE - mound(NX);     // where it meets the hay

      // A light halo behind the needle gives the page some depth.
      // Kept inside the drawing so it never washes over the name above.
      svg.append(el('ellipse', { cx: NX, cy: ENTRY_Y - 50, rx: 300, ry: ENTRY_Y - 60, fill: 'url(#halo)' }));

      // ─── The stack: still, faded, in two depths ───

      let d = `M60,${BASE}`;
      for (let x = 60; x <= 1140; x += 10) d += ` L${x},${(BASE - Math.max(0, mound(x) * 0.88)).toFixed(1)}`;
      d += ` L1140,${BASE} Z`;
      svg.append(el('path', { d, fill: 'url(#hay-shade)', opacity: 0.16, class: 'hay-layer' }));

      function fillStraws(group, tries, colours, width) {
        for (let i = 0; i < tries; i++) {
          const x = rand(40, W - 40);
          const top = mound(x);
          // Taller parts of the mound hold more straw.
          if (top < 6 || Math.random() > top / 270) continue;
          const y = BASE - top * Math.random();
          const tilt = Math.random() < 0.8 ? rand(-0.9, 0.9) : rand(-1.5, 1.5);
          group.append(line(x, y, rand(30, 90), tilt, {
            class: 'straw', stroke: pick(colours), 'stroke-width': rand(width[0], width[1]).toFixed(2)
          }));
        }
        return group;
      }

      const far = fillStraws(el('g', { class: 'hay-layer', filter: 'url(#far-blur)', opacity: 0.3 }),
                             3200, ['#D9C27E', '#C8AE66', '#B4954A'], [1.4, 3]);
      const near = fillStraws(el('g', { class: 'hay-layer', opacity: 0.5 }),
                              1600, ['#C8AE66', '#B4954A', '#9A7B36', '#8A6B2C'], [1, 2.2]);
      svg.append(far, near);
      svg.append(el('ellipse', { cx: NX, cy: ENTRY_Y + 3, rx: 34, ry: 7, fill: 'url(#entry-shadow)', class: 'hay-layer' }));

      // ─── The needle: a sharp olive-silver blade with an open eye ───

      function drawNeedle() {
        const g = el('g', {});
        g.append(el('path', {
          d: `M${-HALF_W} ${HALF_W} A${HALF_W} ${HALF_W} 0 0 1 ${HALF_W} ${HALF_W}`
           + ` L${HALF_W * 0.78} ${LEN * 0.8} L0 ${LEN} L${-HALF_W * 0.78} ${LEN * 0.8} Z`,
          fill: 'url(#olive-silver)', stroke: '#2E3226', 'stroke-width': 0.5
        }));
        const eye = el('ellipse', { cx: 0, cy: EYE_Y, rx: EYE_RX, ry: EYE_RY });
        eye.style.fill = 'var(--straw)';
        g.append(eye);
        return g;
      }

      const link = el('a', { href: 'photography.html', class: 'needle-link', 'aria-label': 'See my work' });
      const pose = el('g', { transform: `translate(${NX} ${ENTRY_Y}) rotate(${TILT}) translate(0 ${SINK - LEN})` });
      const sword = el('g', { class: 'sword' });
      sword.append(drawNeedle(), el('rect', { class: 'needle-hit', x: -16, y: -10, width: 32, height: LEN - SINK + 10 }));
      pose.append(sword);
      link.append(pose);
      svg.append(link);

      // A few straws in front of the buried part, so it reads as pushed into the hay.
      const embed = el('g', { class: 'hay-layer', opacity: 0.6 });
      for (let i = 0; i < 70; i++) {
        const x = NX + rand(-1, 1) * rand(0, 60);
        const y = ENTRY_Y + rand(-3, 52);
        embed.append(line(x, y, rand(24, 70), rand(-0.7, 0.7), {
          class: 'straw', stroke: pick(['#C8AE66', '#B4954A', '#9A7B36']), 'stroke-width': rand(1, 2).toFixed(2)
        }));
      }
      svg.append(embed);

      // On narrow screens, fill the space and crop the sides instead of shrinking.
      const narrow = matchMedia('(max-width: 860px)');
      const fit = () => svg.setAttribute('preserveAspectRatio', narrow.matches ? 'xMidYMax slice' : 'xMidYMax meet');
      narrow.addEventListener('change', fit);
      fit();

      // ─── Clicking the needle flies through its eye into the photographs ───

      link.addEventListener('click', e => {
        // Leave new-tab clicks and reduced-motion visitors to the plain link.
        if (calm || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        throughTheEye();
      });

      function throughTheEye() {
        const ctm = sword.getScreenCTM();
        const pt = svg.createSVGPoint();
        pt.x = 0;
        pt.y = EYE_Y;
        const eye = pt.matrixTransform(ctm);
        const k = Math.hypot(ctm.a, ctm.b);                      // screen pixels per needle unit
        const tilt = Math.atan2(ctm.b, ctm.a) * 180 / Math.PI;   // the needle's lean on screen

        // A copy of the needle drawn over the page, which the camera zooms into.
        const overlay = el('svg', { class: 'eye-zoom', 'aria-hidden': 'true' });
        const zoomed = drawNeedle();
        overlay.append(zoomed);
        document.body.append(overlay);
        sword.style.visibility = 'hidden';

        // Zoom until the straw-coloured eye covers every corner of the screen,
        // which is the colour the photographs page opens on.
        const dx = Math.max(eye.x, innerWidth - eye.x), dy = Math.max(eye.y, innerHeight - eye.y);
        const sMax = 1.06 * Math.hypot(dx / (EYE_RX * k), dy / (EYE_RY * k));
        const T = 1000;
        const t0 = performance.now();

        function frame(now) {
          const t = Math.min(1, (now - t0) / T);
          const s = Math.pow(sMax, t * t);              // speeds up all the way in, never slows at the end
          const a = tilt * Math.max(0, 1 - t * 2);      // stands fully upright by halfway
          zoomed.setAttribute('transform',
            `translate(${eye.x.toFixed(1)} ${eye.y.toFixed(1)}) rotate(${a.toFixed(2)}) scale(${(k * s).toFixed(3)}) translate(0 ${-EYE_Y})`);
          if (t < 1) return requestAnimationFrame(frame);

          // The eye now fills the screen: swap the huge drawing for plain colour and go.
          const cover = document.createElement('div');
          cover.className = 'eye-cover';
          document.body.append(cover);
          overlay.remove();
          try { sessionStorage.setItem('via-needle', '1'); } catch (err) { /* fade-in is optional */ }
          location.href = link.getAttribute('href');
        }

        requestAnimationFrame(frame);
      }

      // Coming back with the browser's Back button restores this page as it was left:
      // clear the zoom so the needle is back in the hay.
      addEventListener('pageshow', e => {
        if (!e.persisted) return;
        document.querySelectorAll('.eye-zoom, .eye-cover').forEach(o => o.remove());
        sword.style.visibility = '';
      });
    </script>

  </body>

</html>
