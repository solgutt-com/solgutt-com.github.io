    <script src="data.js"></script>
    <script src="site.js"></script>
    <script>
      // The reel: one gallery's cover, cut into twelve strips that slide past at their own
      // speeds until the photograph lines up. A different gallery each visit.
      const reel = document.getElementById('reel');
      const link = document.getElementById('reel-link');
      const N = 12;

      const galleries = collections.filter(c => c.type !== 'parent' && c.type !== 'coming-soon' && photosUnder(c.id).length);
      const target = galleries.length ? galleries[Math.floor(Math.random() * galleries.length)] : null;
      const photo = target && coverPhoto(target.id);

      if (photo) {
        link.href = hrefFor(target);
        link.setAttribute('aria-label', `A photograph from ${target.title} slides into place, strip by strip. Open ${target.title}.`);
        reel.style.setProperty('--n', N);
        // The full-size photo, so it is sharp once it settles; every strip shares the one download.
        const src = photoSrc(photo);
        for (let i = 0; i < N; i++) {
          const len = 4 + (i % 3);
          const strip = h('span', { class: 'reel-strip' });
          strip.style.setProperty('--i', i);
          strip.style.setProperty('--len', len);
          strip.style.setProperty('--dur', (1.5 + Math.random() * 1.1).toFixed(2) + 's');
          strip.style.setProperty('--delay', (i * 0.06).toFixed(2) + 's');
          const cells = Array.from({ length: len }, () => h('span', { class: 'reel-cell' }, h('img', { src, alt: '', decoding: 'async' })));
          strip.append(h('span', { class: 'reel-track' }, cells));
          reel.append(strip);
        }
        // Start once the photograph has arrived, so the strips never slide over an empty frame.
        const go = () => { reel.classList.add('ready'); reel.classList.remove('play'); void reel.offsetWidth; reel.classList.add('play'); };
        const probe = new Image();
        probe.onload = probe.onerror = go;
        probe.src = src;
      }
    </script>

  </body>

</html>
